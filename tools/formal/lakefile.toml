# The formal companion (ADR-0032). No dependencies: Mathlib is added only in a commit naming
# the theorem that cannot close without it.
name = "tau-web-formal"
defaultTargets = ["TauWeb", "gate", "witnesses", "render"]

[[lean_lib]]
name = "TauWeb"

# `lake exe gate`: the axiom policy and the requirement index, emitted from the @[req] tags.
[[lean_exe]]
name = "gate"
root = "Gate"
supportInterpreter = true

# `lake exe witnesses DIR`: the witness files, one per module (Witnesses.lean).
[[lean_exe]]
name = "witnesses"
root = "Witnesses"
supportInterpreter = true

# `lake exe render`: the marked regions, from TauWeb/Render.lean. No interpreter: the regions
# are a plain list, not a walk over the environment.
[[lean_exe]]
name = "render"
root = "Render"
