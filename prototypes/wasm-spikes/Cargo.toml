[package]
name = "wasm-spikes"
version = "0.0.0"
edition = "2024"
publish = false

# Throwaway prototypes for OPN-1 (SSH client with host-key pinning) and OPN-21 (pinned TLS
# client). One crate so both spikes share one crypto provider (`ring`) and one dependency
# resolution; features let each be built alone to measure bundle size.

[lib]
crate-type = ["cdylib"]

[features]
default = ["ssh", "tls"]
ssh = ["dep:russh", "dep:hex"]
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pki-types", "dep:rustls-pemfile"]

[dependencies]
wasm-bindgen = "=0.2.127"          # must equal the wasm-bindgen-cli in the devshell (flake.lock)
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
ws_stream_wasm = { version = "0.7", features = ["tokio_io"] }
tokio = { version = "1", default-features = false, features = ["sync", "io-util"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
console_error_panic_hook = "0.1"

russh = { version = "0.63", default-features = false, features = ["ring"], optional = true }
hex = { version = "0.4", optional = true }

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
# `web`: rustls's `std` feature calls `UnixTime::now()`, which on wasm32-unknown-unknown only
# exists with this feature (backed by web-time). Without it rustls 0.23 does not compile.
rustls-pki-types = { version = "1", features = ["web"], optional = true }
rustls-pemfile = { version = "2", optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
