name: gates

# CNF-3 says "The test suite fails when a test is deliberately broken -- verified
# once, by hand, so that 'tests passed' means something". This workflow does that
# for the gates on every run: one negative control per refusal, each against a
# scratch copy, each requiring exactly one finding under the label it targets.
# The list of controls lives in tools/check-controls.sh, runnable locally.
#
# Every step enters the shell flake.nix pins (ADR-0032): the formal gate needs Lean,
# and a missing toolchain is a red gate, not a skipped one.
#
# push is limited to main (ADR-0032, amended 2026-11-04): a PR branch is gated by
# its pull_request run, and a second push run on the same commit checked nothing
# new. Pushes made with GITHUB_TOKEN (the proposals/candidate-order branch) start
# no push run either way; that branch is gated by its pull_request run. A branch
# with no pull request runs the gates through workflow_dispatch. GitHub starts no
# pull_request run while a pull request has merge conflicts; such a pull request
# cannot merge, and the push that resolves the conflict starts the run on the tip
# that will merge. workflow_dispatch gates a conflicted branch before then.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    name: specification gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Run all gates
        run: nix develop --command bash tools/check-all.sh

      # Atlas tests read the current formal-gate index, never a skipped or
      # hand-maintained declaration list. check-all above produces it.
      - name: Exercise specification tools and candidate proposals offline
        run: nix develop --command python3 -m unittest discover -s tools/tests -v

      - name: Prove each gate can fail, one control per refusal
        run: nix develop --command bash tools/check-controls.sh
