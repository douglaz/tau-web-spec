# Procured inference target for the first stage (ARC-31, ARC-31a, ADR-0028).
# The publisher chooses the model here, not in a brief. CNF-78 checks every outgoing request
# against `provider`; CNF-71 checks `retention`. An empty `model` or an empty `provider` fails
# the build: both are publisher decisions not yet taken, a build must not guess either, and
# STG-17 requires a requested provider on every call.

[aggregator]
base_url = "https://api.ppq.ai"
name = "PayPerQ"

[session]
model = "glm-5.3"          # chosen 2026-09-22 by ADR-0033's rule, not by hand: of the models the aggregator
                           # listed that day, 109 were served under its zero-retention tier and supported tool
                           # calls, and exactly one of those carried the aggregator's `popular` flag.
provider = "z-ai"          # the provider requested per machine (ARC-14); empty fails the build.
                           # Sent as the aggregator's routing object `provider: {"only": ["<value>"]}` (ADR-0007:
                           # order/only/ignore). An unsatisfiable value is REFUSED with 404, not silently
                           # rerouted, and a satisfiable one comes back naming the provider that served it
                           # (measured 2026-09-22, docs/findings/2026-09-22-provider-routing.md).
                           # Z.AI makes these weights and also serves them, so this value buys the fewest
                           # parties and counts as one trust domain, not two.
retention = "strictest"    # requested explicitly on every call; the API default is the weaker tier (ARC-31a)

# The recovery ladder's middle rung (ARC-16) needs a stronger model behind the same proxy.
# With one slug the first stage offers rungs one and three only (STG-17).
