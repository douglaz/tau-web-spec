sha256 = "41f73e3cf5fa919b8aa5ca6b30dc48f0da2720776d7423e2a7748211456fe081"
version = "3.24.1"
arch = "x86_64"

[packages]
branch = "v3.24"
repositories = [
  "https://dl-cdn.alpinelinux.org/alpine/v3.24/main",
  "https://dl-cdn.alpinelinux.org/alpine/v3.24/community",
]

# Accepted apk signing keys, as SHA-256 of each key file. This list is DECLARED here and
# VERIFIED at build time: the build extracts /etc/apk/keys from the pinned bootstrap and fails
