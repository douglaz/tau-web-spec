# Every cadence and timeout in the first-stage ceremony and relay, by name. Rules cite the name
# (STG-20, CNF-80, CNF-87, brief 1); the numbers live only here. Values marked placeholder are
# replaced by the first integrated run's measurement, in one commit.

[rescue]
poll_interval = "10s"      # GET /boot/{n}/rescue/last over the tunnel, until host_key fills (CHN-R1: ~80 s)
poll_max = "5m"            # then the activation is unresolved (STA-8), never retried on a timer

[installed]
wait_max = "10m"           # after the reset into the installed system (STG-20)
probe_interval = "15s"     # each probe IS the pinned SSH attempt: TCP refusal or timeout = keep waiting,
                           # any sshd answer ends the wait (success, or a pin halt). Never a bare
                           # connect-and-close, which accrues OpenSSH's per-source penalty (ARC-41).

[relay]                    # first-stage relay, per destination (CNF-87). Placeholders.
min_spacing = "1s"
window = "15m"
window_cap = 200
